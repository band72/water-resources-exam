<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="100%" height="100%">
  <defs>
    <linearGradient id="slopeSoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="100%" stopColor="#1e293b" />
    </linearGradient>
    <linearGradient id="wedgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(245, 158, 11, 0.25)" />
      <stop offset="100%" stopColor="rgba(245, 158, 11, 0.45)" />
    </linearGradient>
    <pattern id="soilBedrock" width="14" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="14" x2="14" y2="0" stroke="rgba(148, 163, 184, 0.15)" strokeWidth="1" />
    </pattern>
    <marker id="arrowRedSlope" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowGreenSlope" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arrowBlueSlope" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background container -->
  <rect width="460" height="280" rx="12" fill="#0b1120" stroke="rgba(255,255,255,0.08)" strokeWidth="1" />

  <!-- Stable Bedrock / Subgrade beneath slip surface -->
  <polygon points="70,220 380,60 430,60 430,250 70,250" fill="url(#soilBedrock)" />
  <line x1="30" y1="220" x2="70" y2="220" stroke="#64748b" strokeWidth="2" />

  <!-- Planar Slip Surface Line (x1=70, y1=220 to x2=380, y2=60) -->
  <line x1="70" y1="220" x2="380" y2="60" stroke="#f59e0b" strokeWidth="2.5" strokeDasharray="6,3" />

  <!-- Sliding Soil Wedge Polygon -->
  <!-- Toe at (70, 220), Crown at (380, 60), Ground surface rolling up to crown -->
  <path d="M 70,220 Q 110,170 140,130 Q 180,95 240,75 Q 310,65 380,60 Z" fill="url(#wedgeGrad)" stroke="#f59e0b" strokeWidth="2" />

  <!-- Ground Surface Label -->
  <g transform="translate(110, 68)">
    <rect width="105" height="20" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.4)" strokeWidth="1" />
    <text x="7" y="14" fill="#f59e0b" fontSize="10" fontWeight="700" fontFamily="sans-serif">GROUND SURFACE</text>
  </g>

  <!-- Slip Surface Callout & Arrow -->
  <line x1="280" y1="175" x2="230" y2="140" stroke="#94a3b8" strokeWidth="1" />
  <polygon points="228,138 238,139 233,146" fill="#94a3b8" />
  <g transform="translate(265, 172)">
    <rect width="180" height="34" rx="5" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(148, 163, 184, 0.3)" strokeWidth="1" />
    <text x="8" y="15" fill="#e2e8f0" fontSize="10" fontWeight="700" fontFamily="sans-serif">ASSUMED PLANAR</text>
    <text x="8" y="27" fill="#38bdf8" fontSize="9.5" fontWeight="700" fontFamily="sans-serif">SLIP SURFACE</text>
  </g>

  <!-- Center of Gravity & Weight Vector WM -->
  <!-- Wedge centroid around (200, 115) -->
  <circle cx="200" cy="115" r="5" fill="#38bdf8" stroke="#ffffff" strokeWidth="1.5" />
  <line x1="200" y1="115" x2="200" y2="175" stroke="#38bdf8" strokeWidth="2.5" markerEnd="url(#arrowBlueSlope)" />
  <text x="210" y="145" fill="#38bdf8" fontSize="12" fontWeight="700" fontFamily="monospace">WM</text>

  <!-- Mobilized Shear Force TMOB (acting downslope parallel to slip line) -->
  <line x1="175" y1="166" x2="140" y2="184" stroke="#f43f5e" strokeWidth="2.5" markerEnd="url(#arrowRedSlope)" />
  <g transform="translate(95, 188)">
    <rect width="52" height="18" rx="3" fill="rgba(15, 23, 42, 0.95)" stroke="#f43f5e" strokeWidth="1" />
    <text x="5" y="13" fill="#f43f5e" fontSize="10" fontWeight="700" fontFamily="monospace">TMOB</text>
  </g>

  <!-- Available Shearing Resistance TFF (acting upslope along slip surface) -->
  <line x1="160" y1="174" x2="195" y2="156" stroke="#10b981" strokeWidth="2.5" markerEnd="url(#arrowGreenSlope)" />
  <g transform="translate(195, 172)">
    <rect width="42" height="18" rx="3" fill="rgba(15, 23, 42, 0.95)" stroke="#10b981" strokeWidth="1" />
    <text x="6" y="13" fill="#10b981" fontSize="10" fontWeight="700" fontFamily="monospace">TFF</text>
  </g>

  <!-- Slip Surface Length Dimension Line Ls -->
  <!-- Parallel offset to slip surface (70,220 -> 380,60) -->
  <line x1="50" y1="230" x2="360" y2="70" stroke="#94a3b8" strokeWidth="1" strokeDasharray="3,2" />
  <line x1="43" y1="218" x2="57" y2="242" stroke="#94a3b8" strokeWidth="1.2" />
  <line x1="353" y1="58" x2="367" y2="82" stroke="#94a3b8" strokeWidth="1.2" />
  <g transform="translate(190, 230)">
    <rect width="75" height="20" rx="4" fill="#0f172a" stroke="rgba(148, 163, 184, 0.3)" strokeWidth="1" />
    <text x="8" y="14" fill="#cbd5e1" fontSize="10.5" fontWeight="700" fontFamily="monospace">Ls (length)</text>
  </g>

  <!-- Inclination Angle alpha_s Arc at Toe -->
  <line x1="70" y1="220" x2="135" y2="220" stroke="#94a3b8" strokeWidth="1" strokeDasharray="2,2" />
  <path d="M 105,220 A 35,35 0 0 0 100,205" fill="none" stroke="#38bdf8" strokeWidth="1.5" />
  <text x="112" y="214" fill="#38bdf8" fontSize="12" fontWeight="700" fontFamily="sans-serif">αs</text>

  <!-- Limit Equilibrium Formula Badge (Top Right) -->
  <g transform="translate(290, 16)">
    <rect width="158" height="36" rx="6" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(56, 189, 248, 0.35)" strokeWidth="1" />
    <text x="10" y="15" fill="#38bdf8" fontSize="10" fontWeight="700" fontFamily="sans-serif">LIMIT EQUILIBRIUM</text>
    <text x="10" y="28" fill="#e2e8f0" fontSize="9.5" fontFamily="monospace">FS = TFF / TMOB</text>
  </g>
</svg>
