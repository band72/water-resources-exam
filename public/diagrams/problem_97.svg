<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="100%">
  <defs>
    <linearGradient id="wallConcrete97" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#334155" />
      <stop offset="100%" stopColor="#1e293b" />
    </linearGradient>
    <linearGradient id="waterGrad97" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="rgba(6, 182, 212, 0.2)" />
      <stop offset="100%" stopColor="rgba(6, 182, 212, 0.4)" />
    </linearGradient>
    <pattern id="soilHatch97" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="12" x2="12" y2="0" stroke="rgba(245, 158, 11, 0.18)" strokeWidth="1" />
    </pattern>
    <marker id="waterArrow97" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#06b6d4" />
    </marker>
    <marker id="soilArrow97" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background subtle panel -->
  <rect width="480" height="280" rx="12" fill="#0b1120" stroke="rgba(255,255,255,0.08)" strokeWidth="1" />

  <!-- Backfill Soil Ground Area (Dry Upper Zone: y = 50 to 130, height = 80px) -->
  <rect x="220" y="50" width="250" height="80" fill="url(#soilHatch97)" />
  <line x1="220" y1="50" x2="470" y2="50" stroke="#f59e0b" strokeWidth="2" />
  
  <!-- Soil Surface Hatch Marks -->
  <line x1="235" y1="50" x2="225" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="260" y1="50" x2="250" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="285" y1="50" x2="275" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="310" y1="50" x2="300" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="335" y1="50" x2="325" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="360" y1="50" x2="350" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="385" y1="50" x2="375" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="410" y1="50" x2="400" y2="38" stroke="#f59e0b" strokeWidth="1.5" />
  <line x1="435" y1="50" x2="425" y2="38" stroke="#f59e0b" strokeWidth="1.5" />

  <!-- Submerged Lower Zone (y = 130 to 210, height = 80px = 4ft) -->
  <rect x="220" y="130" width="250" height="80" fill="url(#waterGrad97)" />
  <!-- Water Table Line -->
  <line x1="220" y1="130" x2="470" y2="130" stroke="#06b6d4" strokeWidth="2" strokeDasharray="5,3" />
  
  <!-- Water Table Symbol ▽ -->
  <polygon points="238,130 244,121 232,121" fill="#06b6d4" />
  <line x1="230" y1="118" x2="246" y2="118" stroke="#06b6d4" strokeWidth="1.5" />
  <line x1="233" y1="115" x2="243" y2="115" stroke="#06b6d4" strokeWidth="1.2" />
  
  <!-- GWT Label Badge -->
  <rect x="252" y="112" width="135" height="18" rx="4" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.4)" strokeWidth="1" />
  <text x="257" y="125" fill="#06b6d4" fontSize="10.5" fontWeight="700" fontFamily="sans-serif">G.W.T. (hw = 4 ft)</text>

  <!-- Subgrade Ground at Toe -->
  <line x1="15" y1="210" x2="120" y2="210" stroke="#94a3b8" strokeWidth="2" />
  <line x1="30" y1="210" x2="22" y2="220" stroke="#64748b" strokeWidth="1.5" />
  <line x1="50" y1="210" x2="42" y2="220" stroke="#64748b" strokeWidth="1.5" />
  <line x1="70" y1="210" x2="62" y2="220" stroke="#64748b" strokeWidth="1.5" />
  <line x1="90" y1="210" x2="82" y2="220" stroke="#64748b" strokeWidth="1.5" />
  <line x1="110" y1="210" x2="102" y2="220" stroke="#64748b" strokeWidth="1.5" />

  <!-- Concrete Gravity Wall Body -->
  <polygon points="120,210 170,50 220,50 220,210" fill="url(#wallConcrete97)" stroke="#38bdf8" strokeWidth="2" />

  <!-- Internal Decomposition Dashed Line -->
  <line x1="170" y1="50" x2="170" y2="210" stroke="rgba(56, 189, 248, 0.35)" strokeWidth="1.5" strokeDasharray="4,4" />

  <!-- Section Weights W1 & W2 -->
  <text x="145" y="145" fill="#94a3b8" fontSize="12" fontWeight="700" fontFamily="monospace">W₁</text>
  <text x="190" y="145" fill="#94a3b8" fontSize="12" fontWeight="700" fontFamily="monospace">W₂</text>

  <!-- Gravity Wall Label Badge (Far Left) -->
  <rect x="18" y="90" width="95" height="38" rx="5" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(148, 163, 184, 0.3)" strokeWidth="1" />
  <text x="24" y="105" fill="#e2e8f0" fontSize="10" fontWeight="700" fontFamily="sans-serif">CONCRETE</text>
  <text x="24" y="120" fill="#38bdf8" fontSize="9.5" fontFamily="monospace">γ = 150 pcf</text>

  <!-- Granular Backfill Properties Box (Top Right) -->
  <rect x="355" y="58" width="115" height="50" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.3)" strokeWidth="1" />
  <text x="362" y="72" fill="#f59e0b" fontSize="10" fontWeight="700" fontFamily="sans-serif">DRY BACKFILL</text>
  <text x="362" y="86" fill="#cbd5e1" fontSize="9" fontFamily="monospace">γ = 110 pcf</text>
  <text x="362" y="99" fill="#cbd5e1" fontSize="9" fontFamily="monospace">φ = 32°, c = 0</text>

  <!-- Submerged Properties Box (Bottom Right) -->
  <rect x="355" y="145" width="115" height="54" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(6, 182, 212, 0.35)" strokeWidth="1" />
  <text x="362" y="159" fill="#06b6d4" fontSize="10" fontWeight="700" fontFamily="sans-serif">SUBMERGED SOIL</text>
  <text x="362" y="173" fill="#94a3b8" fontSize="9" fontFamily="monospace">γsat = 125 pcf</text>
  <text x="362" y="185" fill="#38bdf8" fontSize="9" fontFamily="monospace">γ' = 62.6 pcf</text>

  <!-- Pore Water Pressure Triangle Behind Wall (y=130 to 210, width=32) -->
  <polygon points="220,130 220,210 252,210" fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" strokeWidth="1.5" />
  <line x1="280" y1="183" x2="224" y2="183" stroke="#06b6d4" strokeWidth="2.5" markerEnd="url(#waterArrow97)" />

  <!-- Pore Water Force Badge -->
  <rect x="226" y="188" width="120" height="19" rx="4" fill="rgba(15, 23, 42, 0.95)" stroke="#06b6d4" strokeWidth="1" />
  <text x="231" y="201" fill="#06b6d4" fontSize="9.5" fontWeight="700" fontFamily="monospace">Pw = 499.2 lb/ft</text>

  <!-- Toe Point O -->
  <circle cx="120" cy="210" r="5" fill="#06b6d4" stroke="#ffffff" strokeWidth="2" />
  <text x="108" y="234" fill="#06b6d4" fontSize="14" fontWeight="800" fontFamily="sans-serif">O</text>

  <!-- Dimension 1: Top Width = 2 ft -->
  <line x1="170" y1="32" x2="220" y2="32" stroke="#38bdf8" strokeWidth="1.2" />
  <line x1="170" y1="26" x2="170" y2="50" stroke="#38bdf8" strokeWidth="0.8" strokeDasharray="2,2" />
  <line x1="220" y1="26" x2="220" y2="50" stroke="#38bdf8" strokeWidth="0.8" strokeDasharray="2,2" />
  <polygon points="170,32 177,29 177,35" fill="#38bdf8" />
  <polygon points="220,32 213,29 213,35" fill="#38bdf8" />
  <text x="187" y="26" fill="#38bdf8" fontSize="11" fontWeight="700" fontFamily="monospace">2 ft</text>

  <!-- Dimension 2: Height = 8 ft (Far Left of Wall) -->
  <line x1="102" y1="52" x2="102" y2="208" stroke="#38bdf8" strokeWidth="1.2" />
  <line x1="97" y1="50" x2="170" y2="50" stroke="#38bdf8" strokeWidth="0.8" strokeDasharray="2,2" />
  <line x1="97" y1="210" x2="120" y2="210" stroke="#38bdf8" strokeWidth="0.8" strokeDasharray="2,2" />
  <polygon points="102,52 99,60 105,60" fill="#38bdf8" />
  <polygon points="102,208 99,200 105,200" fill="#38bdf8" />
  <rect x="88" y="122" width="28" height="18" rx="3" fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" strokeWidth="1" />
  <text x="91" y="135" fill="#38bdf8" fontSize="10.5" fontWeight="700" fontFamily="monospace">8 ft</text>

  <!-- Dimension 3: Base Width = 4 ft -->
  <line x1="120" y1="248" x2="220" y2="248" stroke="#38bdf8" strokeWidth="1.2" />
  <line x1="120" y1="210" x2="120" y2="255" stroke="#38bdf8" strokeWidth="0.8" strokeDasharray="2,2" />
  <line x1="220" y1="210" x2="220" y2="255" stroke="#38bdf8" strokeWidth="0.8" strokeDasharray="2,2" />
  <polygon points="120,248 127,245 127,251" fill="#38bdf8" />
  <polygon points="220,248 213,245 213,251" fill="#38bdf8" />
  <text x="162" y="264" fill="#38bdf8" fontSize="11" fontWeight="700" fontFamily="monospace">4 ft</text>
</svg>
